server.port=8082
spring.application.name=transaction-service

# Database configuration (H2)
spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# GraphQL & Swagger
spring.graphql.graphiql.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Business properties (default if config-service is unreachable)
bank.transaction.max-amount=1000

# Feign & Resilience4J
account.service.url=http://localhost:8081

resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=3

# Standalone fail-safe
eureka.client.enabled=false
spring.cloud.config.enabled=false
